name: Build Standalone HTML

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Sankranthi_Chit_Tracker.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build
        run: |
          bun install
          bun run build
          cp dist/index.html Sankranthi_Chit_Tracker.html

      - name: Commit standalone HTML file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sankranthi_Chit_Tracker.html
          git diff --staged --quiet || (git commit -m "chore: update standalone Sankranthi_Chit_Tracker.html" && git push)
